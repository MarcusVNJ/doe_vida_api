spring:
    application:
        name: "Doe Vida"

    jpa:
        properties:
            hibernate:
                jdbc:
                    batch_versioned_data: true
                    batch_size: 50
                order_inserts: true
                use_jdbc_batch_inserts: true
                use_jdbc_batch_updates: true

    datasource:
        url: jdbc:mysql://localhost:3306/doacao_sangue
        username: "user"
        password: "root"
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            idle-timeout: 30000
            max-lifetime: 900000
            connection-timeout: 15000
            pool-name: HikariPool

    liquibase:
        enabled: true
        change-log: classpath:/db/changelog/changelog-master.yaml
        drop-first: true
